<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Оплата заказа #{{order_id}} | ObsidianExchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 10% 20%, rgba(139,92,246,0.25), transparent 60%), linear-gradient(135deg, #050507 0%, #0a0a12 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            max-width: 500px;
            width: 100%;
            background: rgba(15, 15, 22, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 44px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(139,92,246,0.1), 0 0 40px rgba(139,92,246,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .order-id {
            font-size: 14px;
            color: #a0a0b8;
            margin-top: 8px;
            font-weight: 500;
        }
        .amount-block {
            text-align: center;
            margin: 28px 0 24px;
        }
        .amount-value {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
        }
        .amount-currency {
            font-size: 24px;
            color: #c084fc;
            margin-left: 8px;
            font-weight: 600;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .qr-container img {
            width: 200px;
            height: 200px;
            border-radius: 24px;
            border: 2px solid rgba(139,92,246,0.5);
            background: white;
            padding: 8px;
        }
        .payment-btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 60px;
            padding: 16px 24px;
            margin-top: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
        }
        .payment-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            box-shadow: 0 0 15px rgba(139,92,246,0.5);
        }
        .note {
            text-align: center;
            font-size: 13px;
            color: #7a7a99;
            margin-top: 28px;
            border-top: 1px solid rgba(139,92,246,0.2);
            padding-top: 20px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
        .back-link {
            color: #8b5cf6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="header">
        <div class="logo">ObsidianExchange</div>
        <div class="order-id">Заказ #{{order_id}}</div>
    </div>
    <div class="amount-block">
        <span class="amount-value">{{amount}}</span>
        <span class="amount-currency">RUB</span>
    </div>
    <div class="qr-container">
        <img src="data:image/png;base64,{{qr_base64}}" alt="QR-код для оплаты">
    </div>
    <a href="/gateway/{{order_id}}?bank=sber" class="payment-btn">Оплатить через СБП</a>
    <div class="note">
        Вы будете перенаправлены в приложение банка<br>
        Время на оплату: 15 минут
    </div>
    <div class="footer">
        <a href="https://t.me/ObsidianExchangeBot" class="back-link">← Вернуться в бот</a>
    </div>
</div>
</body>
</html>
