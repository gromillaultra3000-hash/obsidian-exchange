[Service]
User=relay-svc
Group=relay-svc
WorkingDirectory=/opt/obsidian-exchange/relay-fastapi

Environment=PYTHONDONTWRITEBYTECODE=1
Environment=RELAY_BACKGROUND_TASKS_ENABLED=1
Environment=RELAY_E2_SHADOW_PRODUCER_ENABLED=0
Environment=RELAY_KAIROS_PRIVATE_KEY_FILE=/etc/obsidian-relay/signing.key
Environment=RELAY_KAIROS_PRINCIPAL_KEY_FILE=/etc/obsidian-relay/principal.key
Environment=RECEIPT_DIR=/var/lib/obsidian-exchange-receipts
Environment=RELAY_LOG_DIR=/var/log/obsidian-relay
Environment=RELAY_PROVIDER_LOG_DIR=/var/log/obsidian-relay

ExecStart=
ExecStart=/opt/obsidian-exchange/relay-venv/bin/python /opt/obsidian-exchange/relay-fastapi/main.py

StateDirectory=obsidian-relay
StateDirectoryMode=0700
LogsDirectory=obsidian-relay
LogsDirectoryMode=0700
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
ReadWritePaths=/var/lib/obsidian-exchange-receipts
UMask=0077
