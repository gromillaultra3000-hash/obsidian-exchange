[Service]
WorkingDirectory=/opt/obsidian-exchange/bot
EnvironmentFile=/etc/obsidian-exchange/app.env
EnvironmentFile=/etc/obsidian-exchange/runtime.env
# Explicitly erase the legacy inline seed from the older override. The
# dedicated worker uses encrypted vaults and never consumes PAYOUT_SEED.
Environment=PAYOUT_SEED=
Environment=WALLET_PAYOUT_PASSWORD=
ExecStart=
ExecStart=/opt/obsidian-exchange/bot/venv/bin/python3 /opt/obsidian-exchange/bot/main_bot.py
