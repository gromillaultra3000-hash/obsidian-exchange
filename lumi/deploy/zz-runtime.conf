[Service]
User=lumi-svc
Group=lumi-svc
WorkingDirectory=/var/lib/lumi

EnvironmentFile=
EnvironmentFile=/etc/lumi/security.env
Environment=LUMI_DATA_DIR=/var/lib/lumi/lumi_profiles

ExecStartPre=
ExecStartPre=/opt/lumi/venv/bin/python /opt/lumi/scripts/check_lumi_env.py
ExecStart=
ExecStart=/opt/lumi/venv/bin/python -m uvicorn lumi.app.main:app --app-dir /opt/lumi --host 127.0.0.1 --port 8010

NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
IPAddressDeny=any
IPAddressAllow=localhost
ReadWritePaths=/var/lib/lumi
UMask=0077
