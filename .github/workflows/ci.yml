name: CI
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Зависимости ядра (без них доказательство владения мертво)
        run: pip install -r relay/core/requirements.txt
      - name: Зависимости тестов (чужие реализации подписи, requests, ed25519)
        run: pip install -r tests/requirements.txt
      - name: Syntax check core files
        run: |
          python3 -m py_compile relay-fastapi/main.py
          python3 -m py_compile relay/services/smart_router.py
          python3 -m py_compile relay/services/payment_service.py
      - name: Syntax check all Python sources
        run: |
          find relay relay-fastapi bot -name '*.py' -print0 | xargs -0 python3 -m py_compile
      - name: Route contract test (critical endpoints + webapp fetch mapping)
        run: python3 tests/test_routes.py
      - name: Landmine check (дефекты, выглядящие как рабочий код)
        run: python3 tests/test_landmines.py
      - name: Единый источник валют/сетей (core.assets)
        run: python3 tests/test_assets.py
      - name: Витрина направлений и тарифы (offerings + pricing)
        run: python3 tests/test_offerings_pricing.py
      - name: Фиксация котировки — что обещали, то и платим (core.quote)
        run: python3 tests/test_quote.py
      - name: Контрольные суммы адресов (BIP-350 векторы + EIP-55)
        run: python3 tests/test_address.py
      - name: XRP — обе формы адреса и destination tag
        run: python3 tests/test_xrp_address.py
      - name: Реестр кошельков
        run: python3 tests/test_wallet_registry.py
      - name: Троттлинг алертов переживает рестарт (core.alert_throttle)
        run: python3 tests/test_alert_throttle.py
      - name: Сверка выдачи с блокчейном (core.payout_discovery)
        run: python3 tests/test_payout_discovery.py
      - name: Поле тега на сайте и в Mini App (спрятать ≠ очистить)
        run: python3 tests/test_tag_field_frontend.py
      - name: Ссылка на транзакцию — у каждой валюты свой обозреватель
        run: python3 tests/test_txid.py
      - name: Доказательство владения адресом подписью (core.sig_proof)
        run: python3 tests/test_sig_proof.py
      # Ниже — наборы, которые гонялись только руками. Набор вне CI бесполезен
      # ровно в тот момент, когда нужен: правку никто не остановит.
      - name: Доставка чека провайдеру (core.receipts)
        run: python3 tests/test_receipts.py
      - name: Выбор пути выплаты
        run: python3 tests/test_payout_selection.py
      - name: Маршрутизация выплаты по сети
        run: python3 tests/test_payout_routing.py
      - name: Кошелёк BTC/LTC
        run: WALLET_DATA_DIR=$RUNNER_TEMP/wallet python3 tests/test_btc_wallet.py
      - name: Кошелёк EVM
        run: WALLET_DATA_DIR=$RUNNER_TEMP/wallet python3 tests/test_evm_wallet.py
      - name: Кошелёк XRP
        run: WALLET_DATA_DIR=$RUNNER_TEMP/wallet python3 tests/test_xrp_wallet.py
      # 06.08.2026: 19 наборов гонялись только руками и в CI не стояли — то есть
      # не остановили бы ни одной правки. Ставим все; недостающие библиотеки
      # оказались единственной причиной, по которой они «не годились для CI».
      - name: RSPay — подпись, реквизиты, статусы, чек, вебхук
        run: python3 tests/test_rspay.py
      - name: Направление продажи — реестр вместо рукописных списков
        run: python3 tests/test_sell_assets.py
      - name: Выплата рублей за продажу — карта, банк, защита от второго перевода
        run: python3 tests/test_sell_payout.py
      - name: Порог доверия клиента — кому какой платёжный канал открыт
        run: python3 tests/test_client_trust.py
      - name: Ставка выкупа — одна формула на бот, сайт и Mini App
        run: python3 tests/test_sell_pricing.py
      - name: Остаток и операции чужого адреса в цепи (BTC/LTC/TRON)
        run: python3 tests/test_chain_watch.py
      - name: Адресная книга клиента
        run: python3 tests/test_address_book.py
      - name: Идентификатор попытки ≠ идентификатор заявки
        run: python3 tests/test_attempt_id.py
      - name: Ответ бота на ввод тега
        run: python3 tests/test_bot_tag_answer.py
      - name: Подтверждения в цепи — не булево «пришло/не пришло»
        run: python3 tests/test_chain_confirm.py
      - name: Сверка выдачи — какие цепи читаются, а какие нет
        run: python3 tests/test_discovery_chains.py
      - name: Monero — свой base58 и keccak-контрольная сумма
        run: python3 tests/test_monero.py
      - name: Очередь выплат с SLA
        run: python3 tests/test_payout_queue.py
      - name: Обещания клиенту не расходятся с расчётом
        run: python3 tests/test_promise_texts.py
      - name: Возможности провайдеров
        run: python3 tests/test_provider_caps.py
      - name: Снятые провайдеры не возвращаются на денежный путь
        run: python3 tests/test_retired_providers.py
      - name: Страж продажи — привязка депозита TON
        run: python3 tests/test_sell_guard_ton.py
      - name: TON — адрес, memo, сеть
        run: python3 tests/test_ton.py
      - name: Кошелёк TON
        run: WALLET_DATA_DIR=$RUNNER_TEMP/wallet python3 tests/test_ton_wallet.py
      - name: TON Connect — проверка ton_proof
        run: python3 tests/test_tonconnect.py
      - name: TON Connect на поверхностях
        run: python3 tests/test_tonconnect_frontend.py
      - name: Связь клиента с подтверждённым кошельком
        run: python3 tests/test_wallet_link.py
      - name: Готовый перевод от сервера, а не от фронта
        run: python3 tests/test_wallet_send.py
