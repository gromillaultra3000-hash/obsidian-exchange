[package]
name = "attestation-automated-schema-dependency-rehearsal"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc"] }
in_toto_attestation = "=0.1.0"
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["alloc"] }
