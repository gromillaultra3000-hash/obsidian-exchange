[workspace]
members = ["crates/wallet-core", "crates/wallet-ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
